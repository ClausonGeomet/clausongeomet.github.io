name: Replace corrupted CV PDF
on:
  push:
    branches: [fix/cv-pdf-20260921]
    paths:
      - .github/workflows/fix-cv-pdf.yml
permissions:
  contents: write
jobs:
  replace:
    if: github.repository == 'ClausonGeomet/clausongeomet.github.io' && github.ref == 'refs/heads/fix/cv-pdf-20260921'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cv-pdf-20260921
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate valid one-page public CV
        run: |
          python -m pip install --disable-pip-version-check reportlab pypdf
          cat > /tmp/generate_cv.py <<'PY'
          from reportlab.lib import colors
          from reportlab.lib.pagesizes import A4
          from reportlab.lib.styles import getSampleStyleSheet, ParagraphStyle
          from reportlab.lib.enums import TA_CENTER, TA_RIGHT
          from reportlab.lib.units import mm
          from reportlab.platypus import SimpleDocTemplate, Paragraph, Spacer, Table, TableStyle

          OUT='assets/Matthew-Clauson-CV.pdf'
          PAGE_W,PAGE_H=A4
          TEAL=colors.HexColor('#0c5b66')
          GREY=colors.HexColor('#55616d')
          styles=getSampleStyleSheet()
          base=ParagraphStyle('base', parent=styles['Normal'], fontName='Helvetica', fontSize=8.05, leading=9.4, textColor=colors.black, spaceAfter=0)
          bullet=ParagraphStyle('bullet', parent=base, leftIndent=11, firstLineIndent=-7, bulletIndent=2, spaceBefore=0.25, spaceAfter=0.15)
          small=ParagraphStyle('small', parent=base, fontSize=7.25, leading=8.2, textColor=GREY)
          section=ParagraphStyle('section', parent=base, fontName='Helvetica-Bold', fontSize=12.0, leading=13.0, textColor=TEAL, spaceBefore=4.4, spaceAfter=1.6)
          role=ParagraphStyle('role', parent=base, fontSize=8.3, leading=9.3)
          date=ParagraphStyle('date', parent=role, textColor=GREY, alignment=TA_RIGHT)
          location=ParagraphStyle('location', parent=role, textColor=GREY)
          name=ParagraphStyle('name', parent=base, fontName='Helvetica-Bold', fontSize=23.0, leading=23.0, alignment=TA_CENTER, spaceAfter=0.6)
          strap=ParagraphStyle('strap', parent=base, fontSize=11.5, leading=12.0, alignment=TA_CENTER, textColor=TEAL, spaceAfter=1.2)
          contact=ParagraphStyle('contact', parent=base, fontSize=8.0, leading=8.8, alignment=TA_CENTER, spaceAfter=4.2)
          tech=ParagraphStyle('tech', parent=base, fontSize=7.7, leading=8.9)
          edu=ParagraphStyle('edu', parent=base, fontSize=8.0, leading=9.0)
          edu_year=ParagraphStyle('edu-year', parent=edu, alignment=TA_RIGHT)

          story=[]
          story.append(Paragraph('Matthew Clauson', name))
          story.append(Paragraph('Geometallurgy | Process Analytics | Statistical Modelling', strap))
          story.append(Paragraph('Perth, WA | matthewclauson@outlook.com | linkedin.com/in/matthewclauson | Australian &amp; British citizen', contact))

          def add_section(title):
              story.append(Paragraph(title, section))
              story.append(Table([['']], colWidths=[PAGE_W-28*mm], rowHeights=[0.55],
                  style=[('BACKGROUND',(0,0),(-1,-1),TEAL),('LEFTPADDING',(0,0),(-1,-1),0),
                         ('RIGHTPADDING',(0,0),(-1,-1),0),('TOPPADDING',(0,0),(-1,-1),0),
                         ('BOTTOMPADDING',(0,0),(-1,-1),0)]))
              story.append(Spacer(1,1.5))

          def add_role(title, company, dates, place, bullets):
              left = f'<b>{title}</b> | <i>{company}</i>'
              table=Table([[Paragraph(left,role),Paragraph(dates,date)]],
                          colWidths=[(PAGE_W-28*mm)*0.72,(PAGE_W-28*mm)*0.28],hAlign='LEFT')
              table.setStyle(TableStyle([('VALIGN',(0,0),(-1,-1),'TOP'),('LEFTPADDING',(0,0),(-1,-1),0),
                                         ('RIGHTPADDING',(0,0),(-1,-1),0),('TOPPADDING',(0,0),(-1,-1),0),
                                         ('BOTTOMPADDING',(0,0),(-1,-1),0)]))
              story.append(table)
              story.append(Paragraph(place,location))
              for item in bullets:
                  story.append(Paragraph('• '+item, bullet))

          add_section('Profile')
          story.append(Paragraph('Geometallurgy and process analytics specialist with 10+ years’ experience across mining and mineral processing. Combines geology, mineralogy, statistics and software engineering to build practical decision tools for sampling, domaining, ore control, plant troubleshooting, forecasting and uncertainty analysis. Experienced in translating complex, multi-source data into operational action and in developing technical capability across teams.',base))

          add_section('Experience')
          add_role('Founder & Principal Consultant','Clauson Geometallurgy Consultancy','Sep 2026 – Present','Perth, Australia',[
              'Developing novel statistical workflows and software for geometallurgical sampling, domaining, uncertainty quantification and predictive modelling.',
              'Translating research methods into reproducible R and Python tools that support testwork design, QA/QC and mine-to-mill decisions.'
          ])
          add_role('Senior Geometallurgist – Process Analytics','Fortescue','Sep 2025 – Present','Perth, Australia',[
              'Supported a cross-functional Iron Bridge troubleshooting team by integrating geology, mineralogy and plant data to identify root causes of product-grade variability.',
              'Built diagnostic, causal and forecasting workflows to quantify drivers of grade, throughput, recovery, energy use and product quality.',
              'Built reusable Python and SQL pipelines plus user-facing trial tools for structured data capture, QA/QC, reconciliation and operational decision-making.'
          ])
          add_role('Senior Geometallurgist – Data Science','Fortescue','Jan 2023 – Sep 2025','Perth, Australia',[
              'Developed a risk-analysis tool used across six major site evaluations to identify and mitigate mud-rush hazards.',
              'Automated QA/QC of external metallurgical laboratory datasets, removing more than 40 hours of manual processing each month.',
              'Applied machine learning to predictive block-model domaining during a three-month drilling campaign, improving repeatability and resource-definition decisions.'
          ])
          add_role('Specialist Geometallurgist – Data Science','South32','May 2021 – Jan 2023','Perth, Australia',[
              'Developed a site-specific geometallurgical framework linking ore characteristics to plant response and supporting throughput improvement without additional capital.',
              'Transferred successful GEMCO practices through structured coaching and technical training for junior staff.'
          ])
          add_role('Geometallurgist','CITIC Pacific Mining','Sep 2019 – May 2021','Cape Preston, Australia',[
              'Automated mineralogical analysis of polished blocks and grain mounts, reducing analysis time by 40%.',
              'Designed and implemented stereological correction workflows for magnetite ore, strengthening mineral characterisation and reporting.'
          ])
          add_role('Project Metallurgist','Western Areas','Aug 2018 – Sep 2019','Cosmic Boy Concentrator, Australia',[
              'Delivered plant-installation milestones and operator training for commissioning of a new bioleaching circuit.'
          ])
          story.append(Paragraph('<b>Earlier experience:</b> Project Metallurgical Technician, Western Areas (2017–2018); Metallurgical Technician / Geology Assistant, Fortescue (2017); Research Geochemist and Shift Chemist, SGS / Wolf Minerals (2016); Graduate Metallurgist, SGS Mineral Services (2015–2016).',base))

          add_section('Technical Capability')
          for label,txt in [
              ('Geometallurgy','domaining, sampling and QA/QC, geostatistics, mineralogy, ore-control alignment, testwork design, mine-to-mill integration.'),
              ('Statistics & modelling','Bayesian and hierarchical modelling, causal inference, experimental design, spatial statistics, time series, machine learning, uncertainty quantification.'),
              ('Technology','Python, R, SQL, Snowflake, Power BI, Git, Kedro, MLflow, reproducible analytics and application development.'),
              ('Processing','comminution, gravity and magnetic separation, flotation, bioleaching, process modelling and plant commissioning.')
          ]:
              story.append(Paragraph(f'<b>{label}:</b> {txt}',tech))

          add_section('Education')
          rows=[
              [Paragraph('<b>Graduate Diploma of Science (Mathematics & Statistics)</b>, University of Southern Queensland – High Distinction',edu),Paragraph('2025',edu_year)],
              [Paragraph('<b>MSc Mining Geology</b>, Camborne School of Mines, University of Exeter',edu),Paragraph('2015',edu_year)],
              [Paragraph('<b>BSc (Hons) Geology</b>, University of Plymouth',edu),Paragraph('2014',edu_year)]
          ]
          table=Table(rows,colWidths=[(PAGE_W-28*mm)*0.90,(PAGE_W-28*mm)*0.10],hAlign='LEFT')
          table.setStyle(TableStyle([('LEFTPADDING',(0,0),(-1,-1),0),('RIGHTPADDING',(0,0),(-1,-1),0),
                                     ('TOPPADDING',(0,0),(-1,-1),0),('BOTTOMPADDING',(0,0),(-1,-1),0),
                                     ('VALIGN',(0,0),(-1,-1),'TOP')]))
          story.append(table)
          story.append(Paragraph('MSc dissertation: Digital image processing and artificial neural networks for fingerprinting a heavy-mineral-sands deposit.',small))

          doc=SimpleDocTemplate(OUT,pagesize=A4,rightMargin=14*mm,leftMargin=14*mm,topMargin=9*mm,bottomMargin=8*mm,
                                title='Matthew Clauson - Curriculum Vitae',author='Matthew Clauson',
                                subject='Geometallurgy, process analytics and statistical modelling')
          doc.build(story)
          PY
          python /tmp/generate_cv.py
          python - <<'PY'
          from pathlib import Path
          p=Path('assets/Matthew-Clauson-CV.pdf')
          b=p.read_bytes()
          assert b.startswith(b'%PDF-'), b[:12]
          assert b.rfind(b'%%EOF') > 0
          assert len(b) > 4000
          print('valid PDF bytes:', len(b))
          PY
          python - <<'PY'
          from pypdf import PdfReader
          r=PdfReader('assets/Matthew-Clauson-CV.pdf')
          assert len(r.pages)==1
          box=r.pages[0].mediabox
          w,h=float(box.width),float(box.height)
          assert abs(w-595.276) < 1 and abs(h-841.89) < 1, (w,h)
          print('one-page A4 PDF validated')
          PY
      - name: Commit repaired asset and remove temporary workflow
        run: |
          rm -f .github/workflows/fix-cv-pdf.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Replace corrupted public CV with valid PDF'
          git push origin HEAD:refs/heads/fix/cv-pdf-20260921
