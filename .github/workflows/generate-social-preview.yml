name: Generate social preview

on:
  push:
    paths:
      - 'assets/social-preview.svg'
      - '.github/workflows/generate-social-preview.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SVG renderer
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin
      - name: Render social preview
        run: rsvg-convert --width 1200 --height 630 assets/social-preview.svg --output assets/social-preview.png
      - name: Commit rendered PNG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/social-preview.png
          if git diff --cached --quiet; then
            echo "No preview changes to commit."
          else
            git commit -m "Generate social preview image"
            git push
          fi
