name: Release copy and presentation checks
on:
  push:
    branches: [release/linkedin-polish-20260921]
    paths:
      - .github/release_polish.py
      - .github/workflows/release-polish.yml
permissions:
  contents: read
jobs:
  polish:
    if: github.repository == 'ClausonGeomet/clausongeomet.github.io' && github.ref == 'refs/heads/release/linkedin-polish-20260921'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/linkedin-polish-20260921
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact, guarded source edits
        run: |
          python -m py_compile .github/release_polish.py
          python .github/release_polish.py apply
      - name: Install browser check dependencies
        run: |
          python -m pip install beautifulsoup4 playwright
          python -m playwright install --with-deps chromium
      - name: Check page structure, links and responsive layout
        run: |
          python .github/release_polish.py check
          cat .release-checks/summary.md >> "$GITHUB_STEP_SUMMARY"
          git diff --check
      - name: Retain responsive evidence
        uses: actions/upload-artifact@v4
        with:
          name: consultancy-release-checks
          path: .release-checks/
          retention-days: 14
      - name: Commit checked source changes to release branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html approach.css approach/index.html packages/index.html tools/index.html drillhole-optimiser/index.html
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'Polish consultancy pitch, content hierarchy and mobile layout'
          git push origin HEAD:refs/heads/release/linkedin-polish-20260921
          git rev-parse HEAD
